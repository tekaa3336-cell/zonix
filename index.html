<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ZONIX</title>
  <meta name="description" content="Curated essentials, updated daily.">
  <meta property="og:title" content="ZONIX">
  <meta property="og:description" content="Curated essentials, updated daily.">
  <meta property="og:image" content="/assets/logo.svg">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="brand">
      <img class="brand__logo" id="logo" src="assets/logo.svg" alt="ZONIX logo" width="104" height="104">
      <h1 class="brand__name" id="brandName">ZONIX</h1>
      <p class="brand__bio" id="brandBio"></p>
    </header>

    <div class="promo" id="promo" hidden>
      <span class="promo__text" id="promoText"></span>
      <button class="promo__code" id="promoCode" type="button" aria-label="Copy discount code"></button>
    </div>

    <section aria-label="Products">
      <div class="grid" id="grid" aria-live="polite"></div>
      <p class="status" id="status">Loading…</p>
    </section>

    <footer class="foot">
      <p id="footNote"></p>
      <p id="footCopy"></p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
